<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3CC6E"/>
      <stop offset="0.5" stop-color="#E2AE52"/>
      <stop offset="1" stop-color="#C98E3A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D4351"/>
      <stop offset="1" stop-color="#05222A"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#073440"/>
      <stop offset="1" stop-color="#042229"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5DB2"/>
      <stop offset="1" stop-color="#F0308F"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7EEF0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- shield -->
  <g filter="url(#shadow)">
    <path d="M256 18 L438 84 L438 292 C438 372 352 432 256 490 C160 432 74 372 74 292 L74 84 Z" fill="url(#gold)"/>
    <path d="M256 38 L420 97 L420 290 C420 360 344 414 256 466 C168 414 92 360 92 290 L92 97 Z" fill="url(#teal)"/>
    <path d="M256 56 L402 108 L402 288 C402 350 336 398 256 444 C176 398 110 350 110 288 L110 108 Z" fill="none" stroke="#F1D79A" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- star -->
  <path d="M256 74 L262.6 89.3 L279.1 90.8 L266.6 101.7 L270.3 118 L256 109.4 L241.7 118 L245.4 101.7 L232.9 90.8 L249.4 89.3 Z" fill="#F2C45A"/>

  <!-- emblem circle -->
  <circle cx="256" cy="236" r="112" fill="url(#core)" stroke="url(#gold)" stroke-width="7"/>

  <g transform="translate(0,-14)">
  <!-- pen tool: bezier path + anchors -->
  <g fill="none" stroke="#F5E6C4" stroke-linecap="round">
    <path d="M176 262 C 200 196, 312 196, 336 262" stroke-width="5"/>
    <line x1="176" y1="262" x2="200" y2="196" stroke-width="2" opacity="0.75"/>
    <line x1="336" y1="262" x2="312" y2="196" stroke-width="2" opacity="0.75"/>
  </g>
  <circle cx="200" cy="196" r="5" fill="#F5E6C4"/>
  <circle cx="312" cy="196" r="5" fill="#F5E6C4"/>
  <rect x="168" y="254" width="16" height="16" rx="2" fill="#042229" stroke="#F5E6C4" stroke-width="3"/>
  <rect x="328" y="254" width="16" height="16" rx="2" fill="#042229" stroke="#F5E6C4" stroke-width="3"/>

  <!-- pen nib -->
  <g>
    <rect x="237" y="156" width="38" height="20" rx="4" fill="#FF3CA0"/>
    <path d="M232 182 L280 182 L292 214 L256 286 L220 214 Z" fill="url(#nib)" stroke="#042229" stroke-width="3" stroke-linejoin="round"/>
    <line x1="256" y1="236" x2="256" y2="282" stroke="#042229" stroke-width="3" stroke-linecap="round"/>
    <circle cx="256" cy="228" r="8" fill="#042229"/>
  </g>

  </g>
  <!-- label -->
  <text x="256" y="310" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-weight="700" font-size="25" letter-spacing="3" fill="#F5E6C4">DESIGNER</text>

  <!-- ribbon -->
  <g filter="url(#shadow)">
    <path d="M150 380 L170 384 L170 420 L150 416 L160 398 Z" fill="#C2216F"/>
    <path d="M362 380 L342 384 L342 420 L362 416 L352 398 Z" fill="#C2216F"/>
    <path d="M160 372 L352 372 L362 396 L352 420 L160 420 L150 396 Z" fill="url(#pink)" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <text x="256" y="405" text-anchor="middle" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" font-weight="700" font-size="21" fill="#FFFFFF">오늘도골대FC</text>
</svg>
